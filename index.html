<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Modern Kawi Transcriber</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An easy-to-use tool for transcribing various Western Malayo-Polynesian languages into the Kawi script.">
    <meta name="author" content="Daniel Saeger">
    <style>
  @font-face {
    font-family: 'Noto Sans';
    font-style: normal;
    font-weight: 400;
    src: local('Noto Sans Regular'), local('NotoSans-Regular'),
         url('fonts/NotoSans-Regular.ttf') format('truetype'),
         url('https://fonts.gstatic.com/s/notosans/v38/o-0eIpHfvRCSob33n9GSMTzaAL8.woff2') format('woff2');
  }

  @font-face {
    font-family: 'Noto Sans';
    font-style: italic;
    font-weight: 400;
    src: local('Noto Sans Italic'), local('NotoSans-Italic'),
         url('fonts/NotoSans-Italic.ttf') format('truetype'),
         url('https://fonts.gstatic.com/s/notosans/v38/o-0gIpHfvRCSob33n9GS830.woff2') format('woff2');
  }

  @font-face {
    font-family: 'Noto Sans';
    font-style: normal;
    font-weight: 700;
    src: local('Noto Sans Bold'), local('NotoSans-Bold'),
         url('fonts/NotoSans-Bold.ttf') format('truetype'),
         url('https://fonts.gstatic.com/s/notosans/v38/o-0NIpHfvRCSob33n9GSVMY.woff2') format('woff2');
  }

  @font-face {
    font-family: 'Noto Sans Kawi';
    font-style: normal;
    font-weight: 400;
    src: local('Noto Sans Kawi'), local('NotoSansKawi-Regular'),
         url('fonts/NotoSansKawi-Regular.ttf') format('truetype'),
         url('https://fonts.gstatic.com/s/notosanskawi/v1/memvYa4up_PsoB63x4J15jMv.woff2') format('woff2');
  }

  html, body {
        margin: 0;
        background-color: #005266;
        color: #fed;
        height: 100%;
        font-family: "Noto Sans", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      textarea {
        font-family: "Noto Sans", "Noto Sans Kawi", sans-serif;
        background-color: #fed;
        color: #005266;
        width: 100%;
        padding: 20px;
        line-height: 1.25;
        border-radius: 10px;
        border: none;
        box-sizing: border-box;
        resize: vertical;
        max-width: 70%;
      }
      #output {
        line-height: 2;
      }
      .interface {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px; /* Adjust vertical spacing between the two rows */
        margin-top: 20px;
      }
      .btn-row {
        display: flex;
        justify-content: center;
        gap: 10px; /* Adjust horizontal spacing between buttons */
      }
      .btn {
        font-family: "Noto Sans", "Noto Sans Kawi", sans-serif;
        padding: 12px;
        padding-block: 0px;
        background: #00748e;
        color: #fed;
        border: 2px solid #fed;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        /*max-height: 40px;*/
      }
      #btn-opt-dh, #btn-opt-pepet, #btn-opt-repha, #btn-opt-diphthong, #btn-opt-vowel, #btn-opt-indep-vowel {
        padding-block-start: 8px;
        min-width: 105px;
      }
      #btn-opt-spacing {
        padding-block-start: 8px;
        min-width: 140px;
      }
      #sample-btn {
        padding-block: 8px;
        min-width: 140px;
      }
      .btn:active {
        background: #005266;
        transform: scale(0.97);
      }
      h3 { font-size: 22px }
      h4 { opacity: .5; font-weight: 400; font-style: italic }
    </style>
  </head>
  <body>
    <div class="interface">
      <div>
        <h3>MODERN KAWI TRANSCRIBER</h3>
        <h4>A Kawi orthography for Austronesian languages</h4>
      </div>
      <div>
        <textarea rows="5" id="input" placeholder="Type here :)" oninput="transcribe()"></textarea>
      </div>
      <div>
        <textarea rows="3" id="output" readonly></textarea>
      </div>
      <div class="buttons">
        <div class="btn-row">
          <input id="btn-opt-pepet" class="btn" type="button" value="ke → 𑼒𑽀" onclick="cycleOption('pepet')">
          <input id="btn-opt-repha" class="btn" type="button" value="rka → 𑼂𑼒" onclick="cycleOption('repha')">
          <input id="btn-opt-indep-vowel" class="btn" type="button" value="a → 𑼄" onclick="cycleOption('indepVowel')">
        </div>
        <div class="btn-row">
          <input id="btn-opt-diphthong" class="btn" type="button" value="kai → 𑼒𑼿" onclick="cycleOption('diphthongMode')">
          <input id="btn-opt-vowel" class="btn" type="button" value="kaa → 𑼒𑼴" onclick="cycleOption('vowelLength')">
          <input id="btn-opt-dh" class="btn" type="button" value="dha → 𑼣𑽂𑼲" onclick="cycleOption('dhMode')">
        </div>
        <div class="btn-row">
          <input id="btn-opt-spacing" class="btn" type="button" value="lan ka → 𑼭𑼥𑽁 𑼒" onclick="cycleOption('spacing')">
          <input id="sample-btn" class="btn" type="button" value="sample text" onclick="loadSample()">
        </div>
      </div>
    </div>
    <script>
      const inputArea = document.getElementById("input");
      const outputArea = document.getElementById("output");

      const codas = new Map([
        ['ng', '𑼁'],
        ['ŋ', '𑼁'],
        ['ṅ', '𑼁'],
        ['ṃ', '𑼁'],
        ['ṁ', '𑼁'],
        ['h', '𑼃'],
        ['ḥ', '𑼃'],
        ["'", '𑼃'],
      ]);
      
      const CONFIGOPTIONS = {
        pepet: {
          states: ['classic', 'phonetic'],
          labels: ['ke → 𑼒𑽀', 'ke → 𑼒𑼾'],
          index: 0,
          element: document.getElementById("btn-opt-pepet")
        },
        spacing: {
          states: ['spaces', 'continua', 'fused'],
          labels: ['lan ka → 𑼭𑼥𑽁 𑼒', 'lan ka → 𑼭𑼥𑽁𑼒', 'lan ka → 𑼭𑼥𑽂𑼒'],
          index: 0,
          element: document.getElementById("btn-opt-spacing")
        },
        repha: {
          states: ['pre', 'post'],
          labels: ['rka → 𑼂𑼒', 'kar → 𑼂𑼒'],
          index: 0, // Defaults to traditional pre-consonant rka
          element: document.getElementById("btn-opt-repha")
        },
        diphthongMode: {
          states: ['diphthong', 'hiatus'],
          labels: ['kai → 𑼒𑼿', 'kai → 𑼒𑼆'],
          index: 0, // Defaults to Indonesian style diphthong
          element: document.getElementById("btn-opt-diphthong") // Match this ID to your HTML button
        },
        vowelLength: {
          states: ['long', 'hiatus'],
          labels: ['kaa → 𑼒𑼴', 'kaa → 𑼒𑼄'],
          index: 0,
          element: document.getElementById("btn-opt-vowel")
        },
        indepVowel: {
          states: ['classic', 'carrier'],
          labels: ['a → 𑼄', 'a → 𑼲'],
          index: 0,
          element: document.getElementById("btn-opt-indep-vowel")
        },
        dhMode: {
          states: ['literal', 'aspirate', 'retroflex'],
          labels: ['dha → 𑼣𑽂𑼲', 'dha → 𑼤', 'dha → 𑼞', 'dha → '],
          index: 0,
          element: document.getElementById("btn-opt-dh")
        },
      };

      const consonantMappings = new Map([
        ['ka', '𑼒'], ['kha', '𑼓'], ['ga', '𑼔'], ['gha', '𑼕'], ['ṅa', '𑼖'], ['ca', '𑼗'], 
        ['cha', '𑼘'], ['ja', '𑼙'], ['jha', '𑼚'], ['ña', '𑼛'], ['ṭa', '𑼜'], ['ṭha', '𑼝'], 
        ['ḍa', '𑼞'], ['ḍha', '𑼟'], ['ṇa', '𑼠'], ['ta', '𑼡'], ['tha', '𑼢'], ['da', '𑼣'], 
        ['dha', '𑼤'], ['na', '𑼥'], ['pa', '𑼦'], ['pha', '𑼧'], ['ba', '𑼨'], ['bha', '𑼩'], 
        ['ma', '𑼪'], ['ya', '𑼫'], ['ra', '𑼬'], ['la', '𑼭'], ['va', '𑼮'], ['śa', '𑼯'], 
        ['ṣa', '𑼰'], ['sa', '𑼱'], ['ha', '𑼲'], ['jña', '𑼳']
      ]);

      const standardConsonants = new Map([
        ['k', 'ka'], ['kh', 'kha'], ['g', 'ga'], ['gh', 'gha'], ['ṅ', 'ṅa'], ['ng', 'ṅa'], 
        ['ŋ', 'ṅa'], ['c', 'ca'], ['ch', 'cha'], ['j', 'ja'], ['jh', 'jha'], ['ñ', 'ña'], 
        ['ny', 'ña'], ['ṭ', 'ṭa'], ['ṭh', 'ṭha'], ['ḍ', 'ḍa'], ['ḍh', 'ḍha'], ['ṇ', 'ṇa'], 
        ['t', 'ta'], ['th', 'tha'], ['d', 'da'], ['dh', 'dha'], ['n', 'na'], ['p', 'pa'], 
        ['ph', 'pha'], ['b', 'ba'], ['bh', 'bha'], ['m', 'ma'], ['y', 'ya'], ['r', 'ra'], 
        ['l', 'la'], ['v', 'va'], ['w', 'va'], ['ś', 'śa'], ['sy', 'śa'], ['sh', 'śa'],
        ['s', 'sa'], ['h', 'ha'], ['jñ', 'jña'], ['jny', 'jña'], ['gy', 'jña'],
        ['f', 'pha'], ['ṣ', 'ṣa'], ['ŝ', 'ṣa'], ['š', 'ṣa'], ['ş', 'ṣa'], ['ss', 'ṣa'], ['ts', 'ca'],
      ]);

      const punctuationMap = new Map([
        // ['\'', ''],
        ['-', ''],
        ['\t', '𑽅'],
        ['.', '𑽄'],
        ['\"', '𑽊'],
        // [',', '𑽉'],
        [',', '𑽃'],
        ['(', '𑽃'],
        [')', '𑽃'],
        [':', '𑽋'],
        [';', '𑽋'],
      ]);

      let independentVowels = new Map();
let vowelMappings = new Map();

function updateMappings() {
  vowelMappings.clear();
  independentVowels.clear();

  const optPepet = CONFIGOPTIONS.pepet.states[CONFIGOPTIONS.pepet.index];
  const optVowel = CONFIGOPTIONS.vowelLength.states[CONFIGOPTIONS.vowelLength.index];
  const optIndep = CONFIGOPTIONS.indepVowel.states[CONFIGOPTIONS.indepVowel.index];
  const optDh = CONFIGOPTIONS.dhMode.states[CONFIGOPTIONS.dhMode.index];

  if (optDh === 'literal') {
    standardConsonants.delete('dh'); 
    standardConsonants.delete('th'); 
  } else if (optDh === 'aspirate') {
    standardConsonants.set('dh', 'dha');
    standardConsonants.set('th', 'tha');
  } else if (optDh === 'retroflex') {
    standardConsonants.set('dh', 'ḍa');
    standardConsonants.set('th', 'ṭa');
  }

  const hiatusGlyph = optIndep === 'carrier' ? '𑼲' : '𑼄';
  CONFIGOPTIONS.vowelLength.labels[1] = `kaa → 𑼒${hiatusGlyph}`;

  CONFIGOPTIONS.vowelLength.element.value = CONFIGOPTIONS.vowelLength.labels[CONFIGOPTIONS.vowelLength.index];

  // Dependent Vowels
  const vowelGroups = [
    { keys: ['a', 'á', 'à', 'â', 'å'], val: '' },
    { keys: ['ā'], val: '𑼴' },
    { keys: ['i', 'í', 'ì', 'î', 'ï'], val: '𑼶' },
    { keys: ['ī'], val: '𑼷' },
    { keys: ['u', 'ú', 'ù', 'û', 'ü'], val: '𑼸' },
    { keys: ['ū'], val: '𑼹' },
    { keys: ['ṛ', 'ŗ'], val: '𑼺' },
    { keys: ['ṝ'], val: '𑼺𑼴' },
    // Accent-marked e ALWAYS stays taling (𑼾), untouched by the pepet toggle
    { keys: ['é', 'è', 'ē'], val: '𑼾' },
    // Only unaccented 'e' responds to the pepet button state
    { keys: ['e'], val: optPepet === 'classic' ? '𑽀' : '𑼾' },
    { keys: ['ě', 'ĕ', 'ë', 'ë́', 'ë̀', 'ë̂', 'ê', 'ə', 'eu', 'ö'], val: '𑽀'}, 
    { keys: ['ö'], val: '𑽀𑼴' }, 
    { keys: ['ai', 'ay'], val: '𑼿' },
    { keys: ['o', 'ó', 'ò', 'ô'], val: '𑼾𑼴' },
    { keys: ['au', 'aw'], val: '𑼿𑼴' },
  ];
  
  if (optVowel === 'long') {
    vowelGroups.push({ keys: ['aa'], val: '𑼴' });
    vowelGroups.push({ keys: ['ii'], val: '𑼷' });
    vowelGroups.push({ keys: ['uu'], val: '𑼹' });
    vowelGroups.push({ keys: ['ěě', 'ĕĕ', 'ö', 'êê', 'ëë', 'əə', 'euu'], val: '𑽀𑼴' });
    vowelGroups.push({ keys: ['ṛṛ', 'ŗŗ'], val: '𑼺𑼴' });
  }

  for (const group of vowelGroups) {
    for (const k of group.keys) {
      vowelMappings.set(k, group.val);
    }
  }

  // --- 2. Independent Vowels (Standalone / Initial) ---
  if (optIndep === 'classic') {
    // CLASSICAL KAWI INDEPENDENT VOWELS
    const indepList = [
      ['a', '𑼄'], ['à', '𑼄'], ['á', '𑼄'], ['â', '𑼄'], ['å', '𑼄'],
      ['ā', '𑼅'],
      ['i', '𑼆'], ['ì', '𑼆'], ['í', '𑼆'], ['î', '𑼆'], ['ï', '𑼆'],
      ['ī', '𑼇'],
      ['u', '𑼈'], ['ù', '𑼈'], ['ú', '𑼈'], ['û', '𑼈'], ['ü', '𑼈'],
      ['ū', '𑼉'],
      ['ṛ', '𑼊'], ['ŗ', '𑼊'],
      ['ṝ', '𑼋'],
      ['ḷ', '𑼌'], ['ļ', '𑼌'],
      ['ḹ', '𑼍'],
      
      // Accented 'e' forms always yield classical taling (𑼎)
      ['é', '𑼎'], ['è', '𑼎'], ['ē', '𑼎'],

      // Unaccented 'e':
      // - e = ë mode ('classic' pepet): 𑼄𑽀 (independent 'a' + pepet sign)
      // - e = é mode ('phonetic' pepet): 𑼎 (classical independent taling)
      ['e', optPepet === 'classic' ? '𑼄𑽀' : '𑼎'],

      // Other pepet representations (eu, ě, ê, ə, etc.) use 𑼄𑽀 in classic mode
      ['eu', '𑼄𑽀'], ['ě', '𑼄𑽀'], ['ĕ', '𑼄𑽀'], ['ë', '𑼄𑽀'], 
      ['ë́', '𑼄𑽀'], ['ë̀', '𑼄𑽀'], ['ë̂', '𑼄𑽀'], ['ê', '𑼄𑽀'], ['ə', '𑼄𑽀'],
      ['ö', '𑼄𑽀𑼴'],

      ['ai', '𑼏'], ['ay', '𑼏'],
      ['o', '𑼐'], ['ò', '𑼐'], ['ó', '𑼐'], ['ô', '𑼐'],
      ['au', '𑼐𑼴'], ['aw', '𑼐𑼴'],
    ];

    if (optVowel === 'long') {
      indepList.push(['aa', '𑼅']);
      indepList.push(['ii', '𑼇']);
      indepList.push(['uu', '𑼉']);
      indepList.push(['ěě', '𑼄𑽀𑼴'], ['ĕĕ', '𑼄𑽀𑼴'], ['ö', '𑼄𑽀𑼴'], ['êê', '𑼄𑽀𑼴'], ['ëë', '𑼄𑽀𑼴'], ['əə', '𑼄𑽀𑼴'], ['euu', '𑼄𑽀𑼴']);
      indepList.push(['ṛṛ', '𑼋'], ['ŗŗ', '𑼋']);
      indepList.push(['ḷḷ', '𑼍'], ['ļļ', '𑼍']);
    }

    for (const [k, v] of indepList) {
      independentVowels.set(k, v);
    }

  } else {
    // CARRIER MODE (𑼲 + Dependent Vowel Sign)
    // Inherits directly from dependent vowelMappings:
    // - Unaccented 'e' (e = ë mode): 𑼲 + 𑽀 -> 𑼲𑽀
    // - Unaccented 'e' (e = é mode): 𑼲 + 𑼾 -> 𑼲𑼾
    // - Accented 'é', 'è', 'ē': 𑼲 + 𑼾 -> 𑼲𑼾
    for (const [vKey, depSign] of vowelMappings.entries()) {
      independentVowels.set(vKey, '𑼲' + depSign);
    }
  }
}
      function cycleOption(key) {
        const opt = CONFIGOPTIONS[key];
        opt.index = (opt.index + 1) % opt.states.length;
        opt.element.value = opt.labels[opt.index];
        updateMappings();
        transcribe();
      }

      updateMappings();

      const SAMPLES = [
        "Semua orang dilahirkan merdeka dan mempunyai martabat dan hak-hak yang sama. Mereka dikaruniai akal dan hati nurani dan hendaknya bergaul satu sama lain dalam semangat persaudaraan.\n<(Indonesian)>",
        "Sabên uwong kalairaké kanthi mardikå lan darbé martabat lan hak-hak kang pådhå. Kabèh pinaringan akal lan kalbu sartå kaajab pasrawungan anggoné mêmitran siji lan sijiné kanthi jiwå sumadulur.\n<(Javanese)>",
        "Sakumna jalma gubrag ka alam dunya téh sipatna merdika jeung boga martabat katut hak-hak anu sarua. Maranéhna dibéré akal jeung haté nurani, campur-gaul jeung sasamana aya dina sumanget duduluran.\n<(Sundanese)>",
        "Bawat tao'y isinilang na may layà at magkakapantáy ang tagláy na dangál at karapatán. Silá'y pinagkalooban ng pangangatwiran at budhî, at dapat magpálagayan ang isá't-isá sa diwà ng pagkákapatiran.\n<(Tagalog)>",
        "An gabos na tawo ipinangaking may katalinkasan asin parantay sa dignidad asin derechos. Sinda gabos tinawan nin pag-isip asin konsiensiya kaya dapat na makipag-iriba sa lambang saro bilang mga magturugang.\n<(Bikol)>",
        "Semua manusia dilahirkan bebas dan sama rata dari segi maruah dan hak-hak. Mereka mempunyai pemikiran dan perasaan hati dan hendaklah bertindak di antara satu sama lain dengan semangat persaudaraan.\n<(Malay)>",
        "Ang tanang katawhan gipakatawo nga may kagawasan ug managsama sa kabililhon. Sila gigasahan sa salabutan ug tanlag og mag-ilhanay isip managsoon sa usa'g-usa diha sa diwa sa ospiritu.\n<(Cebuano)>",
        "Sâdhâjâna orèng lahèr mardhika èsarengè dhrâjhât klabân ha'-ha' sè padâ. Sâdhâjâna èparèngè akal sareng nurani bân kodhu areng-sareng akanca kadhi tarètan.\n<(Madurese)>",
        "Amin nga tao nga sibibiag ket naiyanak a siwawayawaya ken addaan iti agpapada nga dayaw ken kalintegan. Naikkanda ti panagikalintegan ken konsensya a nasken ti panagtitinnulong iti meysa ken meysa iti espiritu nga nainkak-absatan.\n<(Ilocano)>",
        "Ang tanán nga táwo ginbún-ag nga hílway kag may pag-alalangay sa dungóg kag kinamatárong. Silá ginhatágan sing pagpamat-ud kag balatyágon kag nagakadápat nga magbinuligáy sa kahulugan sang pag-inuturáy.\n<(Hiligaynon)>",
        "Sadonyo urang lahia mardeka jo punyo martabaik jo hak-hak nan samo. Nyo diagiah aka jo hati nurani sarato handaknyo babaua samo nan lainnyo dalam samangaik badunsanak.\n<(Minangkabau)>",
        "Sami manusane sane nyruwadi wantah merdeka tur maduwe kautamaan lan hak-hak sane pateh. Sami kalugrain papineh lan idep tur mangdane pada masawitra melarapan semangat pakulawargaan.\n<(Balinese)>",
        "Sarvē mānavāḥ janmanā svatantrāḥ vaiyaktikagauravēṇa adhikārēṇa ca tulyāḥ ēva, sarvēṣāṃ vivēkaḥ ātmasākṣī ca vartatē, sarvē parasparaṃ bhrātṛbhāvēna vyavaharēyuḥ.\n<(Sanskrit)>"
      ];

      let sampleIndex = 0;
      function loadSample() {
        inputArea.value = SAMPLES[sampleIndex];
        sampleIndex = (sampleIndex + 1) % SAMPLES.length;
        transcribe();
      }

      function transcribe() {
        outputArea.value = austroToKawi(inputArea.value);
      }

function austroToKawi(inputText) {
  const ALL_VOWEL_CHARS = 'aeiouāēīōūáéíóúàèìòùâêîôûäëïöüåěĕəë́ë̀ë̂';

  // 1. Normalize NFD & strip combining tone/accent marks uniformly across e, ê, ë, ö, etc.
  inputText = inputText.normalize('NFD');
  inputText = inputText.replace(/([a-df-np-z])[\u0300\u0301\u0302\u0303\u0308\u030A]/gi, '$1'); 
  inputText = inputText.normalize('NFC');

  // 2. Pre-process Tagalog abbreviations
  inputText = inputText
    .replace(/(?<!\p{L})ng\u0303?(?!\p{L})/giu, 'nang')
    .replace(/(?<!\p{L})mg\u0303?a?(?!\p{L})/giu, 'manga');

  // 3. Fused mode: replace spaces and hyphens with zero-width space, but leave apostrophes untouched!
  if (CONFIGOPTIONS.spacing.states[CONFIGOPTIONS.spacing.index] === 'fused') {
    inputText = inputText.replace(/(?<![\.,:;!?"'\(\)𑽄𑽃𑽅𑽊𑽋𑽉])[ -]/g, '\u200B');
  }
  
  const textLower = inputText.toLowerCase();
  let result = '';
  let i = 0;
  
  while (i < textLower.length) {
    let char = textLower[i];

    // --- 1. ABSOLUTE ESCAPE HATCH (PASS-THROUGH TAGS) ---
    if (char === '<') {
      let closeIdx = inputText.indexOf('>', i);
      if (closeIdx !== -1) {
        let rawText = inputText.slice(i + 1, closeIdx);
        result += rawText;
        i = closeIdx + 1;
        continue;
      }
    }

    // --- 2. FORCE EXPLICIT N (BYPASS NG/NC DIGRAPHS) ---
    if (textLower[i] === 'n' && i + 1 < textLower.length && textLower[i + 1] === '\'') {
      if (i + 2 < textLower.length && 'gcj'.includes(textLower[i + 2])) {
        let kawiGlyph = consonantMappings.get('na');
        let insideOpenStack = result.endsWith('𑽂');

        if (!insideOpenStack) {
          result += kawiGlyph + '𑽂';
        } else {
          result += kawiGlyph + '𑽁';
        }
        i += 2; // Consume 'n' and '\''
        continue;
      }
    }

    // --- 3. CODA DIACRITIC EVALUATION ---
    let codaMatched = false;

    for (const cLen of [2, 1]) {
      if (i + cLen <= textLower.length) {
        let potentialCoda = textLower.slice(i, i + cLen);
        if (codas.has(potentialCoda)) {
          let nextIdx = i + cLen;
          
          let crossedBoundary = false;
          while (nextIdx < textLower.length && textLower[nextIdx] === '\u200B') {
            crossedBoundary = true;
            nextIdx++;
          }
              
          let nextChar = textLower[nextIdx];
          let isWordBoundary = !nextChar || ' \'-:;\n\r\t.,𑽉𑽅𑽄𑽊𑽋'.includes(nextChar) || crossedBoundary;
          
          let nextIsConsonant = false;
          let nextIsVowel = false;

          if (nextChar) {
            if (ALL_VOWEL_CHARS.includes(nextChar)) {
              nextIsVowel = true;
            } else {
              for (const testLen of [2, 1]) {
                if (standardConsonants.has(textLower.slice(nextIdx, nextIdx + testLen))) {
                  nextIsConsonant = true;
                  break;
                }
              }
            }
          }

          let validCodaContext = false;
          if (potentialCoda === "'") {
            validCodaContext = isWordBoundary || crossedBoundary;
          } else {
            validCodaContext = isWordBoundary || nextIsConsonant || (crossedBoundary && !nextIsVowel);
          }

          if (validCodaContext) {
            let lastChar = result.slice(-1);
            if (result.length > 0 && !'𑽉𑽅𑽄𑽊𑽃 '.includes(lastChar)) {
              result += codas.get(potentialCoda);
              i = nextIdx;
              codaMatched = true;
              break;
            }
          }
        }
      }
    }
    if (codaMatched) continue;

    char = textLower[i];

    // --- 4. APOSTROPHE STACK-BREAKER ---
    if (char === '\'') {
      if (result.endsWith('𑽂')) {
        result = result.slice(0, -1) + '𑽁';
      }
      i++;
      continue;
    }

    // --- 5. PUNCTUATION HANDLING ---
    if (punctuationMap.has(char)) {
      result += punctuationMap.get(char);
      
      if (i + 1 < textLower.length && textLower[i + 1] === ' ') {
        if (char === '(' || char === ')') {
          i += 2; 
        } else {
          result += ' ';
          i += 2; 
        }
      } else {
        i++;
      }
      continue;
    }
    
    if (char === ' ' || char === '\u200B') {
      if (char === ' ') result += ' ';
      i++;
      continue;
    }

    let matched = false;
    let matchedLength = 1;

    for (const cLen of [2, 1]) {
      if (i + cLen > textLower.length) continue;
      let modernCons = textLower.slice(i, i + cLen);

      if (standardConsonants.has(modernCons)) {
        // Prevent 'ng' from capturing as base consonant if acting as coda
        if (modernCons === 'ng') {
          let afterNgIdx = i + 2;
          let charAfterNg = textLower[afterNgIdx];
          if (!charAfterNg || !ALL_VOWEL_CHARS.includes(charAfterNg)) {
            continue; 
          }
        }

        // REPHA TOGGLE LOGIC
        if (modernCons === 'r') {
          const rephaMode = CONFIGOPTIONS.repha.states[CONFIGOPTIONS.repha.index];

          if (rephaMode === 'pre') {
            let insideOpenStack = result.endsWith('𑽂');

            if (!insideOpenStack) {
              let nextIdx = i + cLen;
              while (nextIdx < textLower.length && (textLower[nextIdx] === '\u200B' || textLower[nextIdx] === '-')) {
                nextIdx++;
              }

              let nextConsLen = 0;
              for (const testLen of [2, 1]) {
                if (nextIdx + testLen <= textLower.length) {
                  let subsequentCons = textLower.slice(nextIdx, nextIdx + testLen);
                  if (standardConsonants.has(subsequentCons)) {
                    nextConsLen = testLen;
                    break;
                  }
                }
              }

              let crossedBoundary = (textLower.slice(i + cLen, nextIdx).includes('\u200B'));

              if (nextConsLen > 0) {
                if (crossedBoundary && result.endsWith('𑽂')) {
                  result = result.slice(0, -1) + '𑽁';
                }

                result += '𑼂'; 
                matchedLength = cLen; 
                matched = true;
                break;
              }
            }

          } else if (rephaMode === 'post') {
            let nextIdx = i + cLen;
            let nextChar = textLower[nextIdx];

            let followedByVowel = false;
            if (nextChar && ALL_VOWEL_CHARS.includes(nextChar)) {
              followedByVowel = true;
            }

            let hasPrecedingSyllable = false;
            if (result.length > 0) {
              let lastChar = result.slice(-1);
              if (!' \t\n\r.,𑽉𑽅𑽄𑽊𑽃'.includes(lastChar)) {
                hasPrecedingSyllable = true;
              }
            }
                            
            let insideOpenStack = result.endsWith('𑽂');
            
            if (hasPrecedingSyllable && !followedByVowel && !insideOpenStack) {
              let insertIdx = result.length;

              while (insertIdx > 0) {
                let cpIdx = insertIdx - 2;
                if (cpIdx < 0) cpIdx = 0;
                let code = result.codePointAt(cpIdx);

                if ((code >= 0x11F34 && code <= 0x11F42) || code === 0x11F52) {
                  insertIdx -= 2;
                } else if (code === 0x11F42 || code === 0x11F41) {
                  insertIdx -= 2;
                } else if (code >= 0x11F00 && code <= 0x11F11) {
  // Independent vowels (0x11F00-0x11F11) never stack. 
  // They are always the base of the syllable.
  insertIdx -= 2;
  break; 
} else if (code >= 0x11F12 && code <= 0x11F33) {
  // Consonants (0x11F12-0x11F33) might be part of a stack.
  insertIdx -= 2;
  let prevCp = insertIdx >= 2 ? result.codePointAt(insertIdx - 2) : 0;
  // If not preceded by a Subjoiner (0x11F42) or Pangkon (0x11F41), it's the base.
  if (prevCp !== 0x11F42 && prevCp !== 0x11F41) { 
    break;
  }
} else {
                  break;
                }
              }

              if (insertIdx < 0) insertIdx = 0;
              result = result.slice(0, insertIdx) + '𑼂' + result.slice(insertIdx);
              matchedLength = cLen;
              matched = true;
              break;
            } 
          }
        }

        let kawiBase = standardConsonants.get(modernCons);

        if (modernCons === 'n' && i + 1 < textLower.length) {
          let nextCharRaw = textLower[i + 1];
          if (nextCharRaw === 'c' || nextCharRaw === 'j') {
            kawiBase = 'ña';
          }
        }

        let kawiGlyph = consonantMappings.get(kawiBase);
          
        for (const vLen of [3, 2, 1]) {
          if (i + cLen + vLen > textLower.length) continue;
          let vowelSub = textLower.slice(i + cLen, i + cLen + vLen);

          if (vLen === 2) {
            let nextCharIdx = i + cLen + vLen;

            if (vowelSub[0] === 'a' && textLower[i + cLen + 1] === '\'') {
              vowelSub = 'a';
            } else if (nextCharIdx < textLower.length && ALL_VOWEL_CHARS.includes(textLower[nextCharIdx])) {
              // Changed literal vowel string to ALL_VOWEL_CHARS reference
              continue;
            } else if (CONFIGOPTIONS.diphthongMode.states[CONFIGOPTIONS.diphthongMode.index] === 'hiatus') {
              if (vowelSub === 'ai' || vowelSub === 'au') {
                continue;
              }
            }
          }

          if (vowelMappings.has(vowelSub)) {
            result += kawiGlyph + vowelMappings.get(vowelSub);
            matchedLength = cLen + vowelSub.length;
            matched = true;
            break;
          }
        }
          
        if (!matched) {
          let nextIdx = i + cLen;
          while (nextIdx < textLower.length && (textLower[nextIdx] === '\u200B' || textLower[nextIdx] === '-')) {
            nextIdx++;
          }

          let nextIsConsonant = false;

          if (nextIdx < textLower.length && !' \t\n\r.,𑽉𑽅𑽄𑽊𑽋'.includes(textLower[nextIdx])) {
            for (const testLen of [2, 1]) {
              if (standardConsonants.has(textLower.slice(nextIdx, nextIdx + testLen))) {
                nextIsConsonant = true;
                break;
              }
            }

            if (!nextIsConsonant && CONFIGOPTIONS.indepVowel.states[CONFIGOPTIONS.indepVowel.index] === 'carrier') {
              for (const vLen of [3, 2, 1]) {
                let candidate = textLower.slice(nextIdx, nextIdx + vLen);
                if (independentVowels.has(candidate)) {
                  nextIsConsonant = true;
                  break;
                }
              }
            }
          }

          if (nextIsConsonant) {
            result += kawiGlyph + '𑽂';
          } else {
            result += kawiGlyph + '𑽁';
          }

          matchedLength = cLen;
          matched = true;
        }
      }
      if (matched) break;
    }
    
    if (!matched) {
      for (const vLen of [3, 2, 1]) {
        if (i + vLen > textLower.length) continue;
        let vowelSub = textLower.slice(i, i + vLen);

        // --- NEW SAFEGUARD ---
        if (vLen === 2) {
          let nextCharIdx = i + vLen;
          
          // 1. Prevent 'ay'/'aw' from stealing the glide if followed by a vowel
          if (nextCharIdx < textLower.length && ALL_VOWEL_CHARS.includes(textLower[nextCharIdx])) {
            continue; 
          } 
          // 2. Respect the hiatus toggle for independent ai/au
          else if (CONFIGOPTIONS.diphthongMode.states[CONFIGOPTIONS.diphthongMode.index] === 'hiatus') {
            if (vowelSub === 'ai' || vowelSub === 'au') {
              continue;
            }
          }
        }

        if (independentVowels.has(vowelSub)) {
          result += independentVowels.get(vowelSub);
          matchedLength = vLen;
          matched = true;
          break;
        }
      }
    }

    if (!matched) {
      result += inputText[i];
    }

    i += matchedLength;
  }

  if (CONFIGOPTIONS.spacing.states[CONFIGOPTIONS.spacing.index] === 'continua') {
    return result.replace(/(?<![\.,:;!?"'\(\)𑽄𑽃𑽅𑽊𑽋𑽉]) /g, '');
  }

  return result;
}
